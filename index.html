const KEY='slotlog_proto_v1',MONKEY='monkey',HOKUTO='hokuto',DISC='disc';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{sessions:[],active:null,stores:[]}}catch(e){state={sessions:[],active:null,stores:[]}};state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.stores=Array.isArray(state.stores)?state.stores:[];for(const s of [...state.sessions,...(state.active?[state.active]:[])]){s.machine??=MONKEY;s.events??=[];s.tags??=[];s.breakMinutes??=0;s.carryUsed??=0;s.replay??=0;if(s.person==='彼氏')s.person='くー';s.tags=s.tags.map(t=>t==='1/2後1周期狙い'?'ハイエナ':t);if(s.machine===HOKUTO){s.hokuto??={mode:'normal',set:1,souls:0,atOpen:false,atLog:[],battleLog:[]};}}const $=id=>document.getElementById(id),num=v=>Number(v)||0,now=()=>new Date().toISOString(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>(n>0?'+':n<0?'':'±')+num(n).toLocaleString('ja-JP')+'枚',stamp=v=>new Date(v).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});let selectedMachine=MONKEY,pendingReplay=0,discFinishPending=false,hokutoNormalView=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('保存に失敗したよ。容量を確認してね')}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2400)}function nav(t){document.querySelectorAll('section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();window.scrollTo(0,0)}function input(id,label,type='number',value='',placeholder=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${type==='number'?'inputmode="numeric" min="0"':''}>`}function valid(id){const el=$(id);if(!el||el.value.trim()===''||!Number.isFinite(Number(el.val const helmetKinds=['未記録','通常','キラキラ','Vロゴ','洞口','浜岡','青島','モノクロ','その他'],logoKinds=['なし','ロゴあり','ロゴキラ'],logoTargets=['洞口','浜岡','青島','モノクロ'];function helmetLabel(kind,logo){return esc(kind||'未記録')+(logoTargets.includes(kind)&&logo&&logo!=='なし'?'＋'+esc(logo):'')}function helmetEventText(e){if(e.beforeKind!==undefined)return helmetLabel(e.beforeKind,e.beforeLogo)+' → '+helmetLabel(e.afterKind,e.afterLogo);if(e.before!==undefined)return esc(e.before)+' → '+esc(e.after);return helmetLabel(e.character,e.logo)}function latestHelmet(s){let h=[...s.events].reverse().find(e=>e.kind==='helmet');if(!h)return{kind:'未記録',logo:'なし'};return{kind:h.afterKind??h.character??h.after??'未記録',logo:h.afterLogo??h.logo??'なし'}}function helmetSelect(prefix,title,kind='未記録',logo='なし'){return `<label>${title}</label><select id="${prefix}Kind" onchange="toggleHelmetLogo('${prefix}')">${helmetKinds.map(x=>`<option ${x===kind?'selected':''}>${x}</option>`).join('')}</select><div id="${prefix}LogoWrap"><label>ロゴ</label><select id="${prefix}Logo">${logoKinds.map(x=>`<option ${x===logo?'selected':''}>${x}</option>`).join('')}</select></div>`}function toggleHelmetLogo(prefix){let on=logoTargets.includes($(prefix+'Kind').value);$(prefix+'LogoWrap').classList.toggle('hidden',!on);if(!on)$(prefix+'Logo').value='なし'}function carryChoices(person){let p=[...state.sessions].reverse().find(s=>s.person===person);return p?`<option value="${num(p.recovery)}">同じ打ち手の前の台から ${num(p.recovery)}枚を引き継ぐ</option>`:''}function updateCarry(){$('carryMode').innerHTML=`<option value="0">引き継がない</option>${carryChoices($('person').value)}`}function chooseMachine(m){selectedMachine=m;renderPlay()}function render(){renderPlay();renderHome();renderHistory();renderStats();renderSettings()}

function submitEvent(k){let s=state.active,e={kind:k,time:now()};if(k==='hit'){e.g=valid('g');if(e.g===null)return;if(s.machine===HOKUTO){e.abeshi=valid('abeshi');if(e.abeshi===null)return}e.reason=$('reason').value.trim()}if(k==='atStart'){if(s.events.filter(x=>x.kind==='atStart').length>s.events.filter(x=>x.kind==='at'&&x.coins!==undefined).length){toast('先にAT終了を記録してね');return}e.coins=valid('atCoins');if(e.coins===null)return}if(k==='at'){let starts=s.events.filter(x=>x.kind==='atStart').length,ends=s.events.filter(x=>x.kind==='at'&&x.coins!==undefined).length;if(starts<=ends){toast('先にAT開始を記録してね');return}e.coins=valid('atCoins');if(e.coins===null)return;e.payout=optional('payout');e.chains=optional('chains');if(e.payout===null||e.chains===null)return;e.atType=$('atType').value}if(k==='invest'){e.yen=valid('cashAmount');if(e.yen===null)return;if(e.yen<=0||e.yen%1000!==0){toast('1,000円単位で入力してね');return}e.amount=e.yen/1000*loanRate(s);s.cashYen=num(s.cashYen)+e.yen;s.investment+=e.amount}if(k==='carryUse'){e.amount=valid('amount');if(e.amount===null)return;if(e.amount>num(s.carryIn)-num(s.carryUsed)){toast('持込の残り枚数を超えているよ');return}s.carryUsed+=e.amount}if(k==='replay'){e.amount=pendingReplay;if(!e.amount){toast('＋46枚を押してね');return}s.replay+=e.amount;pendingReplay=0;s.replayDraft=0}if(k==='helmet'){e.beforeKind=$('beforeKind').value;e.beforeLogo=logoTargets.includes(e.beforeKind)?$('beforeLogo').value:'なし';e.afterKind=$('afterKind').value;e.afterLogo=logoTargets.includes(e.afterKind)?$('afterLogo').value:'なし';e.note=$('helmetNote').value.trim()}if(k==='break'){save();renderPlay();toast('休憩時間を保存したよ');return}if(k==='event'){e.name=$('eventName').value;e.outcome=$('outcome').value}if(k==='finish'){const endDate=readDateTime('endDateTime');if(!endDate||new Date(endDate)<new Date(s.startTime)){toast('終了日時は開始日時以降にしてね');return}s.pendingEndTime=endDate;const g=valid('endG'),r=valid('recovery');if(g===null||r===null)return;let tg=optional('totalG');if(tg===null)return;let d=n const LOWER_OPPONENTS=['シン','サウザー','シュウ','ラオウ','ジャギ','レイ','トキ'];const UPPER_OPPONENTS=['シン','サウザー','シュウ','ラオウ','ジャギ','レイ','トキ'];const TOKUTO_OPPONENTS=['シン','サウザー','ジャギ'];let chosenOpponent='';function charPicker(names,locked=false){if(!names.includes(chosenOpponent))chosenOpponent=names[0];return `<div class="charGrid">${names.map((n,i)=>`<button type="button" class="charStamp ${chosenOpponent===n?'selected':''}" ${locked?'disabled title="勝利または勝舞魂0個まで固定"':`onclick="pickCharacter('${n}')"`}><b>${['👊','🔥','⚡','👑','💥','🌟','❄️'][i%7]}</b>${n}</button>`).join('')}</div><div class="small">選択中：<b id="chosenCharLabel">${esc(chosenOpponent)}</b></div>`}function pickCharacter(n){chosenOpponent=n;document.querySelectorAll('.charStamp').forEach(b=>b.classList.toggle('selected',b.textContent.trim().endsWith(n)));let el=$('chosenCharLabel');if(el)el.textContent=n}function tokutoActive(s){let starts=s.events.filter(e=>e.kind==='tokutoStart').length,ends=s.events.filter(e=>e.kind==='tokutoEnd').length;return starts>ends}function tokutoRounds(s){let start=s.events.findLastIndex? s.events.findLastIndex(e=>e.kind==='tokutoStart') : s.events.map(e=>e.kind).lastIndexOf('tokutoStart');return s.events.slice(start+1).filter(e=>e.kind==='tokutoRound')}function renderTokuto(){let s=state.active,rounds=tokutoRounds(s),last=rounds.at(-1);$('playBody').innerHTML=`<div class="card tokuto"><div class="badge">🔥 特闘専用画面</div><h2>⚔️ 特闘 第${rounds.length+1}ラウンド</h2><p class="small">ラウンドごとに対戦キャラを選択して、勝敗を記録できるよ。</p><div class="small">対戦キャラ</div>${charPicker(TOKUTO_OPPONENTS)}<div class="buttons"><button class="primary" onclick="recordTokuto('win')">🏆 勝利・次ラウンド</button><button class="danger" onclick="recordTokuto('lose')">❌ 敗北・終了</button><button onclick="undoTokuto()">↩️ 直前のラウンドを戻す</button><button onclick="endTokuto()">特闘を終了</button></div><h3>ラウンド履歴</h3>${rounds.map((e,i)=>`<div class="entry small">${i+1}R ${esc(e.opponent)}：${['win','tokuto','kyokuto'].includes(e.result)?'勝利':'敗北'}</div>`).join('')||'<p function hokutoSubmit(k){let s=state.active,h=s.hokuto,e={kind:k,time:now()};if(k==='soul'){e.kind='soul';e.amount=valid('soulAmount');if(e.amount===null||e.amount<=0){toast('1個以上で入力してね');return}e.note=$('soulNote').value.trim();h.souls+=e.amount}if(k==='battle'){e.kind='battle';e.opponent=h.battleLock&&h.souls>0?h.battleLock.opponent:chosenOpponent;e.role=h.battleLock&&h.souls>0?h.battleLock.role:$('role').value;e.result=$('result').value;e.set=h.set;e.atIndex=s.events.filter(x=>x.kind==='atStart').length;if(e.result!=='special'){if(h.souls<1){toast('勝舞魂が足りないよ');return}h.souls--}if(h.upper&&e.result!=='lose'){e.nextGames=valid('upperNextGames');if(e.nextGames===null||e.nextGames<=0){toast('次セットの獲得G数を入力してね');return}e.remainingSouls=h.souls;h.currentGames=e.nextGames;h.souls=0}e.upper=!!h.upper;h.battleLog.push({...e});if(e.result==='lose'&&h.souls>0){h.battleLock={opponent:e.opponent,role:e.role}}else{h.battleLock=null;chosenOpponent=''}if(e.result!=='lose')h.set++}if(k==='event'){e.kind='hEvent';e.name=$('hEventName').value;e.outcome=$('hOutcome').value;e.souls=valid('hEventSouls');if(e.souls===null)return;e.note=$('hNote').value.trim();h.souls+=e.souls;if(e.name==='上位引き戻し'&&e.outcome==='成功'){e.upperEntry=true;e.upperInitialGames=70;e.upperInitialSouls=2;h.upper=true;h.set+=1;h.souls=2;h.currentGames=70;h.battleLock=null}}if(k==='atEnd'){e.kind='at';e.coins=valid('hAtCoins');if(e.coins===null)return;e.payout=optional('hPayout');e.chains=optional('hChains');if(e.payout===null||e.chains===null)return;e.atType=h.upper?'上位AT':'闘神演舞';e.upper=!!h.upper;h.upper=false;h.currentGames=0;h.atOpen=false;h.mode='normal';h.souls=0;h.set=1;h.battleLog=[];h.battleLock=null}if(k==='invest'){e.kind='invest';e.yen=valid('cashAmount');if(e.yen===null||e.yen<=0||e.yen%1000!==0){toast('1,000円単位で入力してね');return}e.amount=e.yen/1000*loanRate(s);s.cashYen+=e.yen;s.investment+=e.amount}if(k==='replay'){e.kind='replay';e.amount=pendingReplay;if(!e.amount){toast('＋46枚を押してね');return}s.replay+=e.amount;s.replayDraft=0;pendingReplay=0}if(k==='break'){save();renderPlay();return}s.events.push(e);if(k==='battle'&&e.result==='tokuto'){enterTokuto('神拳勝舞勝利');return}if(k==='event'&&e.name==='特闘'&&e.outcome==='成功'){enterTokuto('イベント成功');return}if(k==='event'&&(e.name==='エンディング'||e.name==='天撃')){save();renderPlay();showTengeki(e.name,e.outcome);return}save();renderPlay();toast('記録したよ！')}

function showTengeki(source,outcome){let old=$('tengekiOverlay');if(old)old.remove();let el=document.createElement('div');el.id='tengekiOverlay';el.className='tengekiOverlay';el.innerHTML=`<div class="tengekiPanel"><div class="tengekiLightning">⚡</div><h2>${source==='エンディング'?'エンディング 突入！':'天撃'}</h2><p>${source==='エンディング'?'天撃の結果を記録しよう':'天撃の結果を確認しよう'}</p><div class="buttons"><button class="primary" onclick="resolveTengeki('成功')">⚡ 成功・上位ATへ</button><button class="danger" onclick="resolveTengeki('失敗')">失敗・通常へ</button></div><button onclick="closeTengeki()">あとで記録する</button></div>`;document.body.appendChild(el)}

function resolveTengeki(outcome){let s=state.active;if(!s)return;let h=s.hokuto;let last=[...s.events].reverse().find(e=>e.kind==='hEvent'&&(e.name==='天撃'||e.name==='エンディング'));if(last){last.outcome=outcome;if(outcome==='成功'&&!last.upperEntry){last.upperEntry=true;last.upperInitialGames=70;last.upperInitialSouls=2;h.upper=true;h.set+=1;h.souls=2;h.currentGames=70;h.battleLock=null}}closeTengeki();save();renderPlay();toast(outcome==='成功'?'❄️ 上位AT突入！':'天撃の結果を記録したよ')}
function rebuildHokuto(s){let h=s.hokuto,atOpen=false,set=1,souls=0,battleLog=[],upper=false,currentGames=0;for(const e of s.events){if(e.kind==='atStart'){atOpen=true;set=1;souls=0;battleLog=[];upper=false;currentGames=0}if(e.kind==='soul')souls+=num(e.amount);if(e.kind==='hEvent'){souls+=num(e.souls);if(e.upperEntry){upper=true;set+=1;souls=2;currentGames=70}}if(e.kind==='battle'){if(e.result!=='special')souls--;battleLog.push({...e});if(e.result!=='lose'){set++;if(e.upper){currentGames=num(e.nextGames);souls=0}}}if(e.kind==='at'){atOpen=false;set=1;souls=0;battleLog=[];upper=false;currentGames=0}}h.atOpen=atOpen;h.mode=atOpen?'at':'normal';h.set=set;h.souls=Math.max(0,souls);h.battleLog=battleLog;h.upper=upper;h.currentGames=currentGames;const lastBattle=[...s.events].reverse().find(e=>e.kind==='battle');h.battleLock=atOpen&&souls>0&&lastBattle?.result==='lose'?{opponent:lastBattle.opponent,role:lastBattle.role}:null}function hokutoUndo(){let s=state.active;let i=s.events.length-1;if(i<0||s.events[i].kind==='atStart'){toast('この操作は戻せないよ');return}if(!confirm('直前の記録を取り消す？'))return;let e=s.events.pop();if(e.kind==='invest'){s.investment-=num(e.amount);s.cashYen-=num(e.yen)}if(e.kind==='replay')s.replay-=num(e.amount);rebuildHokuto(s);save();renderPlay()}
function renderHome(){let a=totalFor('ゆー'),b=totalFor('くー');$('total').textContent=fmt(a+b);$('yuTotal').textContent=fmt(a);$('bfTotal').textContent=fmt(b);$('machineTotals').innerHTML=[MONKEY,HOKUTO,DISC].map(m=>`<div class="entry"><b>${m===MONKEY?'🏍️':m===DISC?'🎧':'👊'} ${machineName(m)}</b><div class="metric ${totalFor(null,m)>=0?'green':'red'}" style="font-size:22px">${fmt(totalFor(null,m))}</div><div class="small">${state.sessions.filter(s=>s.machine===m).length}台の実践</div></div>`).join('');drawChart()}function drawChart(){let list=[...state.sessions].sort((a,b)=>new Date(a.playDate||a.endTime)-new Date(b.playDate||b.endTime)),y=0,b=0,pts=[{y:0,b:0,t:0}];for(const s of list){if(s.person==='ゆー')y+=sessionDiff(s);else b+=sessionDiff(s);pts.push({y,b,t:y+b})}const values=pts.flatMap(p=>[p.y,p.b,p.t]);let lo=Math.min(0,...values),hi=Math.max(0,...values);if(hi===lo){hi+=100;lo-=100}const X=i=>36+(i/Math.max(1,pts.length-1))*288,Y=v=>180-(v-lo)/(hi-lo)*150;let svg=`<line x1="36" y1="30" x2="36" y2="180" stroke="#516078"/><line x1="36" y1="${Y(0)}" x2="325" y2="${Y(0)}" stroke="#6c788f" stroke-dasharray="4 4"/><text x="3" y="35">${hi}</text><text x="3" y="183">${lo}</text>`;for(const [k,c] of [['y','#5ee2b0'],['b','#6dafff'],['t','#f8d17c']])svg+=`<polyline fill="none" stroke="${c}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p,i)=>`${X(i)},${Y(p[k])}`).join(' ')}"/>`;svg+='<text x="36" y="202">開始</text><text x="285" y="202">最新</text>';$('chart').innerHTML=svg}

function renderHanabiPlay(){let s=state.active,events=s.events.map((e,i)=>`<div class="entry"><b>${eventTitle(e)} <span class="small">${stamp(e.time)}</span></b><div class="small">${eventText(e)}</div><button onclick="removeEvent(${i})">取り消し</button></div>`).join('');$('playBody').innerHTML=`<div class="card hanabi"><div class="small">実践中 · ${stamp(s.startTime)}</div>${s.machine===HOKUTO&&s.hokuto?.atOpen?`<button class="primary" style="width:100%;margin:10px 0" onclick="hokutoNormalView=false;renderPlay()">👊 闘神演舞の記録画面に戻る</button>`:``}<h2>🎆 新ハナビ</h2><p class="small">${esc(s.person)} / ${esc(s.store||'店舗未入力')} / ${esc(s.machineNo||'–')}番台</p><div class="line"></div><div class="row"><div><div class="small">現金投資</div><b>${num(s.cashYen).toLocaleString()}円</b><div class="small">${num(s.investment)}枚</div></div><div><div class="small">持込 / 貯メダル</div><b>${num(s.carryIn)} / ${num(s.replay)}枚</b></div></div><p class="small">休憩 ${num(s.breakMinutes)}分 ／ 実稼働 ${durationLabel(s,now())}</p><div class="buttons"><button class="primary" onclick="showForm('invest')">💵 現金投資</button><button onclick="showForm('replay')">💳 貯メダル再プレイ</button><button onclick="showForm('break')">☕ 休憩時間</button></div><div id="eventForm"></div><h3>📖 投資履歴</h3>${events||'<p class="small">まだ記録はないよ。</p>'}<div class="line"></div><button class="warn" style="width:100%" onclick="showForm('finish')">📸 ユニメモで実践を終了</button></div>`}
const originalShowForm=showForm;
showForm=function(k){if(state.active?.machine===HANABI&&k==='finish'){hanabiFinishPending=false;hanabiOcrText='';hanabiShowMissing=false;let s=state.active;$('eventForm').innerHTML=`<div class="card hanabi"><h2>🎆 新ハナビ・実践終了</h2><label>実践日</label><input id="hanabiPlayDate" type="date" value="${new Date().toLocaleDateString('sv-SE')}"><div class="card hanabi"><h3>📸 ユニメモ画像を読み込む</h3><p class="small">複数枚を選択可能。画像は保存せず、読み取った数値だけ保存するよ。OCRはネット接続が必要。必ず確認してね。</p><input type="file" id="hanabiFiles" accept="image/*" multiple><button class="primary" style="width:100%;margin-top:10px" onclick="hanabiRead()">🔍 画像を解析する</button><p id="hanabiStatus" class="notice">未読取。画像なしで手入力も可能だよ。</p><details><summary>OCRの文字を確認</summary><textarea id="hanabiRaw" rows="5" readonly></textarea></details><h3>✏️ 読み取り結果</h3><div id="hanabiFields">${HANABI_GROUPS.map(([title,fields])=>`<details class="hanabi-group" open><summary>${title} <span class="hanabi-count"></span></summary><div class="ocrgrid">${fields.map(([key,label])=>`<div class="hanabi-field" data-key="${key}"><label for="hanabi_${key}">${esc(label)}</label><input type="number" min="0" step="1" inputmode="numeric" placeholder="未記録" id="hanabi_${key}" oninput="hanabiRefresh()"></div>`).join('')}</div></details>`).join('')}</div><button style="width:100%" onclick="hanabiShowMissing=!hanabiShowMissing;hanabiRefresh()" id="hanabiMissing">📝 未記録の項目を表示</button></div>${input('recovery','終了時の持ちメダル枚数','number','')}<p class="small">差枚＝終了枚数−持込−現金貸出枚数−貯メダル再プレイ枚数。終了時G数の入力は不要だよ。</p><div id="hanabiPreview"></div><div class="buttons"><button onclick="showFormCancel()">キャンセル</button><button class="primary" onclick="hanabiPreviewFinish()">🔎 保存内容を確認</button></div></div>`;hanabiRefresh();$('eventForm').scrollIntoView({behavior:'smooth',block:'nearest'});return}originalShowForm(k)};
function hanabiRefresh(){let fields=[...document.querySelectorAll('.hanabi-field')];fields.forEach(el=>{let filled=el.querySelector('input').value.trim()!=='';el.classList.toggle('hidden',!filled&&!hanabiShowMissing);let label=HANABI_FIELDS.find(([k])=>k===el.dataset.key)?.[1]||'';el.querySelector('label').textContent=(filled?'✅ ':'')+label});document.querySelectorAll('.hanabi-group').forEach(g=>{let all=[...g.querySelectorAll('.hanabi-field')],n=all.filter(x=>x.querySelector('input').value.trim()!=='').length;g.classList.toggle('hidden',!n&&!hanabiShowMissing);g.querySelector('.hanabi-count').textContent=`（${n}/${all.length}項目）`});let btn=$('hanabiMissing');if(btn)btn.textContent=hanabiShowMissing?'📝 未記録を閉じる':'📝 未記録の項目を表示'}
function hanabiCollect(){let out={ocrStatus:hanabiOcrText?'ocr':'manual'};for(const [k] of HANABI_FIELDS){let el=$('hanabi_'+k);if(!el||el.value.trim()==='')continue;let v=Number(el.value);if(!Number.isSafeInteger(v)||v<0){toast('ユニメモの数値は0以上の整数にしてね');return null}out[k]=v}return out}
function hanabiParse(text){let out={},norm=t=>String(t).normalize('NFKC').replace(/[\s　・･()（）:：_\-‐－]/g,'').toUpperCase();let aliases={totalGames:['総プレイ数'],totalBonus:['総ボーナス'],donBB:['ドンBB'],redBB:['赤七BB'],rb:['RB'],bellTotal:['風鈴合算'],bellA:['風鈴A'],bellB:['風鈴B'],iceTotal:['氷合算'],iceA:['氷A'],iceB:['氷B'],cherryTotal:['チェリー合算'],cherryA1:['チェリーA1'],cherryA2:['チェリーA2'],cherryB:['チェリーB'],challengeMiss:['花火チャレンジ中はずれ'],gameMiss:['花火GAME中はずれ'],bbBellMiddle:['風鈴中段揃い'],bbBellDiagonal:['風鈴斜め揃い'],rbOneCoin:['1枚役'],rbNoticeIce:['予告音氷'],rbMiddleIce:['中1ST氷揃い'],rbMiddleOther:['中1ST氷以外15枚役取得'],rbMiddleFail:['中1ST失敗'],rbMaxSuccess:['最大成功'],rbMaxConsecutive:['最大連続成功'],rbMaxSkill:['最大神技'],rbMaxPayout:['最大獲得枚数'],rbOver100:['獲得枚数100枚超え'],bgmOhanabi:['大花火'],bgmDon2:['ドンちゃん2'],maxRtChain:['最大RT連チャン'],max100Chain:['100G以内最大連チャン'],max100Payout:['100G以内最大獲得枚数'],reachCollection:['新規']};let lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean),rules=Object.entries(aliases).flatMap(([k,aa])=>aa.map(a=>({k,label:norm(a)}))).sort((a,b)=>b.label.length-a.label.length);let section='';for(let i=0;i<lines.length;i++){let line=norm(lines[i]);if(line.includes('RB中詳細'))section='rb';if(line.includes('連チャンBGM'))section='bgm';if(line.includes('リーチ目コレクション'))section='reach';if(line.includes('小役関連')||line.includes('BB中詳細')||line.includes('RT詳細')||line.includes('その他'))section='';for(const rule of rules){if(out[rule.k]!==undefined||!line.includes(rule.label))continue;if(rule.k==='rb'&&!/^RB(?:\d|$)/.test(line))continue;if(rule.k==='rbOneCoin'&&section!=='rb')continue;if(['bgmOhanabi','bgmDon2'].includes(rule.k)&&section!=='bgm')continue;if(rule.k==='reachCollection'&&section!=='reach')continue;let tail=line.slice(line.indexOf(rule.label)+rule.label.length);let match=tail.match(/^\D*(\d[\d,]*)\s*(?:回|枚|G|\/|$)/);if(!match&&i+1<lines.length)match=norm(lines[i+1]).match(/^(\d[\d,]*)(?:回|枚|G|\/|$)/);if(match){out[rule.k]=Number(match[1].replace(/,/g,''));break}}}return out}
async function hanabiRead(){let files=[...($('hanabiFiles')?.files||[])],status=$('hanabiStatus');if(!files.length){toast('ユニメモ画像を選択してね');return}status.textContent='OCRを準備中…';try{await loadDiscOCR();let worker=await Tesseract.createWorker('jpn+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent=`解析中 ${Math.round((m.progress||0)*100)}%`}});let texts=[];try{for(let i=0;i<files.length;i++){status.textContent=`${i+1}/${files.length}枚目を解析中…`;let r=await worker.recognize(files[i]);texts.push(r.data.text)}}finally{await worker.terminate()}hanabiOcrText=texts.join('\n');$('hanabiRaw').value=hanabiOcrText;let date=discExtractDate(hanabiOcrText);if(date)$('hanabiPlayDate').value=date;let found=hanabiParse(hanabiOcrText);for(const [k,v] of Object.entries(found)){let el=$('hanabi_'+k);if(el)el.value=v}hanabiRefresh();status.textContent=`${Object.keys(found).length}項目を候補として入力したよ。数値と項目の取り違えがないか確認してね。`;toast('画像の読み取りが終わったよ！')}catch(e){console.error(e);status.textContent='読み取りに失敗したよ。通信を確認するか手入力してね。'}}
function hanabiPreviewFinish(){let d=hanabiCollect(),r=valid('recovery'),date=$('hanabiPlayDate')?.value,s=state.active;if(!d||r===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')){toast('実践日を確認してね');return}let count=Object.keys(d).length-1,diff=r-num(s.investment)-num(s.carryIn)-num(s.replay);hanabiFinishPending=true;$('hanabiPreview').innerHTML=`<div class="card hanabi"><h3>🔎 保存前の確認</h3><p class="small">実践日：${esc(date)}<br>${esc(s.person)} / ${esc(s.store||'店舗未入力')} / ${esc(s.machineNo||'–')}番台<br>ユニメモ ${count}項目（未記録は0と区別）<br>総プレイ数：${d.totalGames??'未記録'}G / ドンBB：${d.donBB??'未記録'} / 赤七BB：${d.redBB??'未記録'} / RB：${d.rb??'未記録'}<br>現金：${num(s.cashYen)}円（${num(s.investment)}枚） / 持込：${num(s.carryIn)}枚 / 再プレイ：${num(s.replay)}枚 / 回収：${r}枚<br><strong>差枚：${fmt(diff)}</strong></p><button class="primary" style="width:100%" onclick="hanabiConfirmFinish()">💾 この内容で保存</button></div>`;$('hanabiPreview').scrollIntoView({behavior:'smooth',block:'nearest'})}
function hanabiConfirmFinish(){if(!hanabiFinishPending||state.active?.machine!==HANABI)return;let d=hanabiCollect(),r=valid('recovery'),date=$('hanabiPlayDate')?.value;if(!d||r===null||!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return;let s=state.active;s.hanabi=d;s.playDate=date;s.playDateSource='confirmed';s.endG=null;s.recovery=r;s.endTime=now();s.totalG=d.totalGames??0;state.sessions.push(s);state.active=null;hanabiFinishPending=false;save();nav('history');toast('🎆 新ハナビの実践を保存したよ！')}
const originalRenderHome=renderHome;
renderHome=function(){originalRenderHome();let target=$('machineTotals');target.insertAdjacentHTML('beforeend',`<div class="entry"><b>🎆 新ハナビ</b><div class="metric ${totalFor(null,HANABI)>=0?'green':'red'}" style="font-size:22px">${fmt(totalFor(null,HANABI))}</div><div class="small">${state.sessions.filter(s=>s.machine===HANABI).length}台の実践</div></div>`)};
function hanabiHistory(s){let d=s.hanabi||{};return `<div class="small">🎆 ${d.totalGames??'–'}G ｜ ドンBB ${d.donBB??'–'} ｜ 赤七BB ${d.redBB??'–'} ｜ RB ${d.rb??'–'}</div><details><summary>🎆 ユニメモ詳細を見る</summary>${HANABI_GROUPS.map(([title,fields])=>`<h3>${title}</h3>${fields.filter(([k])=>d[k]!==undefined).map(([k,l])=>`<div class="small">${esc(l)}：${num(d[k]).toLocaleString()}</div>`).join('')||'<p class="small">未記録</p>'}`).join('')}<label>実践日を修正</label><input type="date" id="historyDate_${Number(s.id)}" value="${esc(s.playDate||'')}"><button onclick="updateHistoryDate(${Number(s.id)})">実践日を保存</button></details><details><summary>💰 収支・投資履歴</summary><p class="small">現金 ${num(s.cashYen)}円 / 持込 ${num(s.carryIn)}枚 / 再プレイ ${num(s.replay)}枚 / 回収 ${num(s.recovery)}枚 / 休憩 ${num(s.breakMinutes)}分</p>${s.events.map(e=>`<div class="small">${eventTitle(e)}：${eventText(e)}</div>`).join('')}</details>`}
const originalRenderHistory=renderHistory;
renderHistory=function(){originalRenderHistory();let el=$('historyBody');if(!state.sessions.some(s=>s.machine===HANABI))return;let all=[...state.sessions].sort((a,b)=>String(b.playDate||b.startTime).localeCompare(String(a.playDate||a.startTime)));el.innerHTML=all.map(s=>s.machine===HANABI?`<div class="entry"><b>📅 ${esc(s.playDate||'–')} · ${esc(s.person)} <span class="${sessionDiff(s)>=0?'green':'red'}">${fmt(sessionDiff(s))}</span></b><div class="small">${esc(s.store||'店舗未入力')} / 🎆 新ハナビ / ${esc(s.machineNo||'–')}番台</div>${hanabiHistory(s)}<details><summary>🕒 実践の開始・終了日時を編集</summary><label>開始日時</label><input type="datetime-local" id="histStart_${Number(s.id)}" value="${localDateTime(s.startTime)}"><label>終了日時</label><input type="datetime-local" id="histEnd_${Number(s.id)}" value="${localDateTime(s.endTime||s.startTime)}"><button onclick="updateHistoryTimes(${Number(s.id)})">日時を保存</button></details><div class="small">🕒 ${esc(stamp(s.startTime))} 〜 ${esc(stamp(s.endTime||s.startTime))}</div><button class="danger" style="padding:7px 12px;margin-top:8px" onclick="deleteSession(${Number(s.id)})">この実践を削除</button></div>`:`<div class="entry"><b>📅 ${historyDate(s)} · ${esc(s.person)} <span class="${sessionDiff(s)>=0?'green':'red'}">${fmt(sessionDiff(s))}</span></b><div class="small">${esc(s.store||'店舗未入力')} / ${machineName(s)} / ${esc(s.machineNo||'–')}番台</div>${s.machine===DISC?`<details><summary>🎧 マイスロ詳細・収支</summary>${discHistory(s)}<label>実践日を修正</label><input type="date" id="historyDate_${Number(s.id)}" value="${esc(s.playDate||new Date(s.startTime).toLocaleDateString('sv-SE'))}"><button onclick="updateHistoryDate(${Number(s.id)})">実践日を保存</button><p class="small">持込 ${num(s.carryIn)}枚 / 投資 ${num(s.investment)}枚 / 貯メダル ${num(s.replay)}枚 / 回収 ${num(s.recovery)}枚</p></details>`:`<details><summary>記録を表示</summary><p class="small">持込 ${num(s.carryIn)}枚 / 投資 ${num(s.investment)}枚 / 貯メダル ${num(s.replay)}枚 / 回収 ${num(s.recovery)}枚</p>${s.machine===HOKUTO?`<p class="small">着席 ${num(s.startAbeshi)}あべし ${shutterSummary(s)}</p>`:''}${s.events.map(e=>`<div class="small">${eventTitle(e)}：${eventText(e)}</div>`).join('')}</details>`}<details><summary>🕒 実践の開始・終了日時を編集</summary><label>開始日時</label><input type="datetime-local" id="histStart_${Number(s.id)}" value="${localDateTime(s.startTime)}"><label>終了日時</label><input type="datetime-local" id="histEnd_${Number(s.id)}" value="${localDateTime(s.endTime||s.startTime)}"><button onclick="updateHistoryTimes(${Number(s.id)})">日時を保存</button></details><div class="small">🕒 ${esc(stamp(s.startTime))} 〜 ${esc(stamp(s.endTime||s.startTime))}</div><button class="danger" style="padding:7px 12px;margin-top:8px" onclick="deleteSession(${Number(s.id)})">この実践を削除</button></div>`).join('')};
const originalRenderStats=renderStats;
renderStats=function(){if($('statsMachine').value!==HANABI)return originalRenderStats();let who=$('statsPerson').value,list=state.sessions.filter(s=>s.machine===HANABI&&(!who||s.person===who)),sum=k=>list.reduce((a,s)=>a+(Number.isFinite(s.hanabi?.[k])?s.hanabi[k]:0),0),paired=k=>list.filter(s=>Number.isFinite(s.hanabi?.[k])&&Number.isFinite(s.hanabi?.totalGames)),ratio=(n,d)=>d>0?'1/'+(d/n).toFixed(1):'–',diff=list.reduce((a,s)=>a+sessionDiff(s),0),mins=list.reduce((a,s)=>a+minutes(s,s.endTime),0);let html=`<h2 style="margin-top:18px">🎆 新ハナビ専用統計</h2><div class="row"><div><div class="small">実践数</div><b>${list.length}台</b></div><div><div class="small">累計差枚</div><b>${fmt(diff)}</b></div></div><div class="row"><div><div class="small">実稼働</div><b>${(mins/60).toFixed(1)}時間</b></div><div><div class="small">ユニメモ総G</div><b>${sum('totalGames').toLocaleString()}G</b></div></div>`;for(const [title,fields] of HANABI_GROUPS){html+=`<h3>${title}</h3>`;for(const [k,label] of fields){let entries=list.filter(s=>Number.isFinite(s.hanabi?.[k]));if(!entries.length)continue;let val=k.startsWith('rbMax')||k.startsWith('max')?Math.max(...entries.map(s=>s.hanabi[k])):sum(k),pair=paired(k),cnt=pair.reduce((a,s)=>a+s.hanabi[k],0),games=pair.reduce((a,s)=>a+s.hanabi.totalGames,0),prob=['donBB','redBB','rb','bellTotal','bellA','bellB','iceTotal','iceA','iceB','cherryTotal','cherryA1','cherryA2','cherryB'].includes(k)&&cnt>0?` / ${ratio(cnt,games)}（${pair.length}台分）`:'';html+=`<div class="entry small">${esc(label)}：${val.toLocaleString()} ${k==='totalGames'?'G':k.toLowerCase().includes('payout')?'枚':'回'}${prob} <span class="muted">（記録 ${entries.length}/${list.length}台）</span></div>`}}html+='<p class="small">※未記録は0と区別。小役確率は総Gと小役の両方が登録された実践のみで計算。RT・BB・RB中の確率は分母が不明なため回数表示だよ。</p>';$('statsBody').innerHTML=html};
render();
