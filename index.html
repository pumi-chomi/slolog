<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>ふたりのスロログ v0.7</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f3f4f6;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:0 0 90px}.wrap{max-width:650px;margin:auto;padding:18px}h1{font-size:23px;margin:8px 0 3px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px}.sub,.small{color:#aab3c5;font-size:12px;line-height:1.65}.small{font-size:13px}.card{background:#192236;border:1px solid #2e3b53;border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 4px 18px #0002}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}.metric{font-size:28px;font-weight:800;margin:8px 0}.green{color:#5ee2b0}.red{color:#ff8899}label{display:block;font-size:13px;color:#c4cee0;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #42516d;background:#0e1729;color:white;border-radius:11px;padding:13px;font-size:16px}button{border:0;border-radius:12px;padding:13px 14px;background:#394967;color:white;font-size:14px;font-weight:700;cursor:pointer;min-height:44px}button.primary{background:#59d8af;color:#0a1a21}button.warn{background:#e8a65a;color:#172032}button.danger{background:#6b3445;color:#fff}button:disabled{opacity:.5}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#111a2c;border-top:1px solid #314058;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}.tabs button{flex:1;max-width:180px;background:transparent;border-radius:0;color:#aab7cd;font-size:12px;padding:14px 4px}.tabs button.active{color:#5ee2b0}.hidden{display:none!important}.chip{display:inline-block;border-radius:20px;background:#2b3954;padding:6px 10px;margin:4px 4px 4px 0;font-size:12px}.entry{border-top:1px solid #33415a;padding:11px 0}.entry:first-child{border:0}.entry b{display:block;margin-bottom:4px}.notice{background:#332b24;border:1px solid #776047;color:#ffe1b0;border-radius:12px;padding:11px;font-size:12px;line-height:1.6}.line{height:1px;background:#33415a;margin:14px 0}summary{cursor:pointer;color:#bfe6d9}.pill{border-radius:30px;padding:6px 9px;background:#2b3b55;font-size:12px}header{display:flex;align-items:center;justify-content:space-between}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#294c43;padding:11px 16px;border-radius:12px;display:none;z-index:99;font-size:13px;max-width:90%}#chart{width:100%;height:210px}#chart text{fill:#9aa9c0;font-size:11px}.hokuto{background:linear-gradient(150deg,#281419,#130f17 65%);border:1px solid #7e3c3c}.hokuto h2,.hokuto h3{color:#f4cf83}.hokuto button.primary{background:#c69a46;color:#21140a}.hokuto .line{background:#60383c}.hokuto .counter{font-size:36px;color:#f5d47e;font-weight:900;text-align:center}.hokuto .badge{background:#51252b;color:#ffdbab;border:1px solid #a35b50;padding:7px 10px;border-radius:30px;display:inline-block}.hokuto .battle{background:#6e2834}.hokuto .victory{background:#a47a36;color:#1d1108}.hokuto .special{background:#76456e}.hokuto .defeat{background:#663039}.machinePick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.machinePick button{padding:19px 7px;line-height:1.6}.machinePick .selected{outline:2px solid #e8bc68;background:#51343a}.tagLabel{display:inline-flex;align-items:center;gap:6px;margin:5px}.tagLabel input{width:auto}.muted{color:#9ba8bc}
</style></head><body><div id="toast"></div><div class="wrap"><header><div><h1>🎰 ふたりのスロログ</h1><div class="sub">MONKEY TURN V × 北斗の拳 転生の章2 · v0.7.6</div></div><span class="pill">試作版</span></header><section id="home"><div class="notice">⚠️ データはこのブラウザ内だけに保存されるよ。更新前に「設定」からJSONバックアップを保存してね。2人の端末間同期は未対応。</div><div class="card"><div class="small">累計差枚（全機種）</div><div class="metric" id="total">±0枚</div><div class="row"><div><div class="small">ゆー</div><b id="yuTotal">±0枚</b></div><div><div class="small">くー</div><b id="bfTotal">±0枚</b></div></div></div><div class="card"><h2>📈 累計差枚の推移</h2><svg id="chart" viewBox="0 0 340 210" preserveAspectRatio="none" aria-label="累計差枚グラフ"></svg><div class="small">🟢 ゆー　🔵 くー　🟡 2人合算</div></div><div class="card"><h2>🎰 機種別の差枚</h2><div id="machineTotals"></div></div><button class="primary" style="width:100%" onclick="nav('play')">＋ 実践を記録する</button></section><section id="play" class="hidden"><div id="playBody"></div></section><section id="history" class="hidden"><div class="card"><h2>📖 実践履歴</h2><div id="historyBody"></div></div></section><section id="stats" class="hidden"><div class="card"><h2>📊 実戦統計</h2><label>機種を選択</label><select id="statsMachine" onchange="renderStats()"><option value="monkey">🏍️ モンキーターンV</option><option value="hokuto">👊 北斗の拳 転生の章2</option></select><div id="statsBody"></div></div></section><section id="settings" class="hidden"><div class="card" id="storeSettings"></div><div class="card"><h2>⚙️ データ管理</h2><p class="small">既存のモンキー記録はそのまま読み込むよ。バックアップは定期的に保存してね。</p><button onclick="exportData()">記録をJSONで書き出す</button><div class="line"></div><button class="danger" onclick="clearData()">全データを削除</button></div></section></div><nav class="tabs"><button data-tab="home" class="active" onclick="nav('home')">🏠<br>ホーム</button><button data-tab="play" onclick="nav('play')">🎰<br>実践</button><button data-tab="history" onclick="nav('history')">📖<br>履歴</button><button data-tab="stats" onclick="nav('stats')">📊<br>統計</button><button data-tab="settings" onclick="nav('settings')">⚙️<br>設定</button></nav><script>
'use strict';
const KEY='slotlog_proto_v1',MONKEY='monkey',HOKUTO='hokuto';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{sessions:[],active:null,stores:[]}}catch(e){state={sessions:[],active:null,stores:[]}};state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.stores=Array.isArray(state.stores)?state.stores:[];for(const s of [...state.sessions,...(state.active?[state.active]:[])]){s.machine??=MONKEY;s.events??=[];s.tags??=[];s.breakMinutes??=0;s.carryUsed??=0;s.replay??=0;if(s.person==='彼氏')s.person='くー';s.tags=s.tags.map(t=>t==='1/2後1周期狙い'?'ハイエナ':t);if(s.machine===HOKUTO){s.hokuto??={mode:'normal',set:1,souls:0,atOpen:false,atLog:[],battleLog:[]};}}const $=id=>document.getElementById(id),num=v=>Number(v)||0,now=()=>new Date().toISOString(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>(n>0?'+':n<0?'':'±')+num(n).toLocaleString('ja-JP')+'枚',stamp=v=>new Date(v).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});let selectedMachine=MONKEY,pendingReplay=0;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('保存に失敗したよ。容量を確認してね')}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2400)}function nav(t){document.querySelectorAll('section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();window.scrollTo(0,0)}function input(id,label,type='number',value='',placeholder=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${type==='number'?'inputmode="numeric" min="0"':''}>`}function valid(id){const el=$(id);if(!el||el.value.trim()===''||!Number.isFinite(Number(el.value))||Number(el.value)<0){toast('数値を正しく入力してね');return null}return Number(el.value)}function optional(id){return $(id).value.trim()===''?undefined:valid(id)}function machineName(s){return (typeof s==='string'?s:s.machine)===HOKUTO?'北斗の拳 転生の章2':'モンキーターンV'}function loanRate(s){let st=state.stores.find(x=>x.name===s.store);return st&&num(st.lend)>0?num(st.lend):46}function rate(s){let st=state.stores.find(x=>x.name===s.store);return st&&num(st.exchange)>0?1000/num(st.exchange):null}function sessionDiff(s){return num(s.recovery)-num(s.investment)-num(s.carryIn)-num(s.replay)}function totalFor(person,machine){return state.sessions.filter(s=>(!person||s.person===person)&&(!machine||s.machine===machine)).reduce((a,s)=>a+sessionDiff(s),0)}function minutes(s,end){return Math.max(0,(new Date(end||now())-new Date(s.startTime))/60000-num(s.breakMinutes))}function durationLabel(s,end){let m=Math.floor(minutes(s,end));return `${Math.floor(m/60)}時間${m%60}分`}function money(n){return Math.round(n).toLocaleString('ja-JP')+'円'}function inject(e){return e.kind==='invest'||e.kind==='replay'?num(e.amount):0}function phaseInfo(s){let last=num(s.carryIn),lastIndex=-1,open=null,out=[];for(let i=0;i<s.events.length;i++){let e=s.events[i];if(e.kind==='atStart'){let added=s.events.slice(lastIndex+1,i).reduce((a,x)=>a+inject(x),0);open={start:i,coins:num(e.coins),used:last+added-num(e.coins)}}if(e.kind==='at'&&open){let extra=s.events.slice(open.start+1,i).reduce((a,x)=>a+inject(x),0);out.push({start:open.coins,end:num(e.coins),normalUsed:open.used,net:num(e.coins)-open.coins-extra});last=num(e.coins);lastIndex=i;open=null}}return out}
const helmetKinds=['未記録','通常','キラキラ','Vロゴ','洞口','浜岡','青島','モノクロ','その他'],logoKinds=['なし','ロゴあり','ロゴキラ'],logoTargets=['洞口','浜岡','青島','モノクロ'];function helmetLabel(kind,logo){return esc(kind||'未記録')+(logoTargets.includes(kind)&&logo&&logo!=='なし'?'＋'+esc(logo):'')}function helmetEventText(e){if(e.beforeKind!==undefined)return helmetLabel(e.beforeKind,e.beforeLogo)+' → '+helmetLabel(e.afterKind,e.afterLogo);if(e.before!==undefined)return esc(e.before)+' → '+esc(e.after);return helmetLabel(e.character,e.logo)}function latestHelmet(s){let h=[...s.events].reverse().find(e=>e.kind==='helmet');if(!h)return{kind:'未記録',logo:'なし'};return{kind:h.afterKind??h.character??h.after??'未記録',logo:h.afterLogo??h.logo??'なし'}}function helmetSelect(prefix,title,kind='未記録',logo='なし'){return `<label>${title}</label><select id="${prefix}Kind" onchange="toggleHelmetLogo('${prefix}')">${helmetKinds.map(x=>`<option ${x===kind?'selected':''}>${x}</option>`).join('')}</select><div id="${prefix}LogoWrap"><label>ロゴ</label><select id="${prefix}Logo">${logoKinds.map(x=>`<option ${x===logo?'selected':''}>${x}</option>`).join('')}</select></div>`}function toggleHelmetLogo(prefix){let on=logoTargets.includes($(prefix+'Kind').value);$(prefix+'LogoWrap').classList.toggle('hidden',!on);if(!on)$(prefix+'Logo').value='なし'}function carryChoices(person){let p=[...state.sessions].reverse().find(s=>s.person===person);return p?`<option value="${num(p.recovery)}">同じ打ち手の前の台から ${num(p.recovery)}枚を引き継ぐ</option>`:''}function updateCarry(){$('carryMode').innerHTML=`<option value="0">引き継がない</option>${carryChoices($('person').value)}`}function chooseMachine(m){selectedMachine=m;renderPlay()}function render(){renderPlay();renderHome();renderHistory();renderStats();renderSettings()}
function renderPlay(){let s=state.active;if(!s){$('playBody').innerHTML=`<div class="card"><h2>🎰 実践開始</h2><div class="machinePick"><button class="${selectedMachine===MONKEY?'selected':''}" onclick="chooseMachine('monkey')">🏍️<br>モンキーターンV</button><button class="${selectedMachine===HOKUTO?'selected':''}" onclick="chooseMachine('hokuto')">👊<br>北斗の拳 転生の章2</button></div><label>打ち手</label><select id="person" onchange="updateCarry()"><option>ゆー</option><option>くー</option></select><label>店舗（設定から登録）</label><select id="store"><option value="">店舗を選択（未登録可）</option>${state.stores.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select>${input('machineNo','台番号','text','','例：123')}${input('startG','着席時G数','number',0)}${selectedMachine===HOKUTO?`${input('startAbeshi','着席時のあべし数（任意の数値）','number',0)}<label>狙い方（複数選択可）</label><div id="tags">${['リセット狙い','シャッター狙い','設定狙い','その他'].map(t=>`<label class="tagLabel"><input type="checkbox" class="tag" value="${t}" ${selectedMachine===HOKUTO?'onchange="toggleShutterStart()"':''}> ${t}</label>`).join('')}</div><p class="small">前兆確認は実践開始後に6つの範囲から記録できるよ。</p>`:`<label>着席条件（任意・複数選択）</label><div id="tags">${['リセット','1周期狙い','ハイエナ','洞口ヘルメット','浜岡ヘルメット','青島ヘルメット','モノクロ','キラキラ','ロゴあり','ロゴキラ','Vロゴ','その他'].map(t=>`<label class="tagLabel"><input type="checkbox" class="tag" value="${t}" ${selectedMachine===HOKUTO?'onchange="toggleShutterStart()"':''}> ${t}</label>`).join('')}</div>`}<label>前の台からの持ちメダル引き継ぎ</label><select id="carryMode"><option value="0">引き継がない</option>${carryChoices('ゆー')}</select><p class="small">前の台の終了枚数を、次の台の持込枚数として扱うよ。</p><button class="primary" style="width:100%;margin-top:15px" onclick="startSession()">実践スタート</button></div>`;return}if(s.machine===HOKUTO&&s.hokuto?.atOpen){renderHokutoAt();return}let events=s.events.map((e,i)=>`<div class="entry"><b>${i+1}. ${eventTitle(e)} <span class="small">${stamp(e.time)}</span></b><div class="small">${eventText(e)}</div><button style="margin-top:6px;padding:7px 12px" onclick="removeEvent(${i})">取り消し</button></div>`).join('');$('playBody').innerHTML=`<div class="card ${s.machine===HOKUTO?'hokuto':''}"><div class="small">実践中 · ${stamp(s.startTime)}</div><h2>${s.machine===HOKUTO?'👊':'🏍️'} ${machineName(s)}</h2><div class="small">${esc(s.person)} / ${esc(s.store||'店舗未入力')} / ${esc(s.machineNo||'台番未入力')}番台</div><div class="small">開始 ${s.startG}G ${s.machine===HOKUTO?' / '+num(s.startAbeshi)+'あべし':''}　${s.tags.map(esc).join('・')}</div>${renderShutterPanel(s)}${s.machine===HOKUTO?`<div class="notice" style="margin-top:12px">⚔️ 神拳勝舞の記録は「🟢 AT開始」で開始時の持ちメダルを保存すると表示される専用AT画面から入力できるよ。対戦相手7人・成立役・勝敗・特殊継続に対応！</div><details class="card"><summary>⚔️ 神拳勝舞の記録履歴（${s.events.filter(e=>e.kind==='battle').length}件）</summary>${s.events.filter(e=>e.kind==='battle').map(e=>`<div class="entry small">${eventText(e)}</div>`).join('')||'<p class="small">まだ記録がないよ。</p>'}</details>`:''}<div class="line"></div><div class="row"><div><div class="small">現金投資</div><b>${num(s.cashYen).toLocaleString()}円</b><div class="small">貸出 ${num(s.investment)}枚</div><div class="small">持込 ${num(s.carryIn)}枚 / 使用 ${num(s.carryUsed)}枚 / 貯メダル ${num(s.replay)}枚</div></div><div><div class="small">初当たり</div><b>${s.events.filter(e=>e.kind==='hit').length}回</b><div class="small">最終持ちメダルは終了時に入力</div></div></div><div class="buttons"><button class="primary" onclick="showForm('hit')">🔥 初当たり</button>${s.machine===HOKUTO?'<button onclick="toggleShutterPanel()">🔍 前兆確認を記録</button>':''}<button onclick="showForm('atStart')">🟢 AT開始</button>${s.machine===MONKEY?'<button onclick="showForm(\'at\')">🏁 AT終了</button>':''}<button onclick="showForm('invest')">💵 現金投資</button><button onclick="showForm('replay')">💳 貯メダル再プレイ</button><button onclick="showForm('event')">⭐ イベント</button>${s.machine===MONKEY?'<button onclick="showForm(\'helmet\')">🪖 ヘルメット</button>':''}<button onclick="showForm('break')">☕ 休憩時間</button></div><div class="small">休憩 ${num(s.breakMinutes)}分 ／ 実稼働 ${durationLabel(s,now())}</div><div id="eventForm"></div><h2 style="margin-top:18px">記録タイムライン</h2>${events||'<p class="small">まだイベントはないよ。</p>'}<div class="line"></div><button class="warn" style="width:100%" onclick="showForm('finish')">実践を終了する</button></div>`}
const SHUTTER_RANGES=['32〜48','160〜176','288〜304','416〜432','480〜496','600〜620'];
function toggleShutterStart(){}
function shutterSelected(){return [...document.querySelectorAll('.shutterRange:checked')].map(x=>x.value)}
let shutterPanelOpen=false;function toggleShutterPanel(){shutterPanelOpen=!shutterPanelOpen;renderPlay();if(shutterPanelOpen){let e=$('shutterPanel');if(e)e.scrollIntoView({behavior:'smooth',block:'nearest'})}}function renderShutterPanel(s){if(s.machine!==HOKUTO||!shutterPanelOpen)return '';let ranges=s.shutterRanges||{};return `<div id="shutterPanel" class="card" style="background:#231821;border-color:#8b5d45"><h2>🔍 前兆確認を記録</h2><p class="small">6つの範囲それぞれを記録できるよ。未入力と判別不可は別扱い。シャッター狙い以外でも記録OK！</p>${SHUTTER_RANGES.map(r=>`<label>${r}あべし</label><select class="shutterResult" data-range="${r}"><option value="" ${!ranges[r]?'selected':''}>未入力</option>${['あり','なし','判別不可'].map(x=>`<option ${ranges[r]===x?'selected':''}>${x}</option>`).join('')}</select>`).join('')||'<p class="small">確認範囲はまだ選ばれていないよ。</p>'}<button class="primary" style="width:100%;margin-top:12px" onclick="saveShutterResults()">前兆確認結果を保存</button></div>`}
function saveShutterResults(){let s=state.active;if(!s||s.machine!==HOKUTO)return;s.shutterRanges??={};document.querySelectorAll('.shutterResult').forEach(el=>{s.shutterRanges[el.dataset.range]=el.value||null});save();shutterPanelOpen=false;renderPlay();toast('前兆確認結果を保存したよ！')}
function shutterSummary(s){let x=s.shutterRanges||{},r=Object.keys(x);return r.length?' / 前兆 '+r.map(k=>esc(k)+'：'+esc(x[k]||'未入力')).join('・'):''}
function startSession(){let g=valid('startG');if(g===null)return;let ab=selectedMachine===HOKUTO?valid('startAbeshi'):0;if(ab===null)return;let shutterRanges={};state.active={id:Date.now(),machine:selectedMachine,person:$('person').value,store:$('store').value.trim(),machineNo:$('machineNo').value.trim(),startG:g,startAbeshi:ab,shutterRanges,tags:[...document.querySelectorAll('.tag:checked')].map(x=>x.value),startTime:now(),investment:0,cashYen:0,carryIn:num($('carryMode').value),carryUsed:0,replay:0,breakMinutes:0,events:[]};if(selectedMachine===HOKUTO)state.active.hokuto={mode:'normal',set:1,souls:0,atOpen:false,atLog:[],battleLog:[]};save();render();toast('実践開始！')}
function eventTitle(e){return({hit:'🔥 初当たり',atStart:'🟢 AT開始',at:'🏁 AT終了',invest:'💵 現金投資',carryUse:'🎰 持込使用',spend:'🎰 メダル使用',gain:'✨ 実際の増加',replay:'💳 貯メダル再プレイ',helmet:'🪖 ヘルメット',abeshiLog:'🔢 あべし記録',hEvent:'🔥 北斗イベント',soul:'💎 勝舞魂',battle:'⚔️ 神拳勝舞'})[e.kind]||'⭐ イベント'}function eventText(e){switch(e.kind){case'abeshiLog':return `${num(e.abeshi)}あべし${e.g===null||e.g===undefined?'':' / '+num(e.g)+'G'}${e.note?' / '+esc(e.note):''}`;case'hit':return `${num(e.g)}G ${e.abeshi!==undefined?' / '+num(e.abeshi)+'あべし':''} / 契機：${esc(e.reason||'未入力')}`;case'atStart':return `開始時 ${num(e.coins)}枚`;case'at':return `${esc(e.atType||'AT')} / 終了時 ${e.coins===undefined?'未記録':num(e.coins)+'枚'} / リザルト ${e.payout??'–'}枚 / ${e.chains||'–'}連`;case'invest':return `${e.yen===undefined?'旧記録':e.yen+'円'} / ${num(e.amount)}枚`;case'replay':case'carryUse':case'spend':return `${num(e.amount)}枚`;case'gain':return `+${num(e.amount)}枚`;case'helmet':return `${helmetEventText(e)} / ${esc(e.note||'')}`;case'soul':return `+${num(e.amount)}個 / ${esc(e.note||'')}`;case'battle':return `${esc(e.opponent||'未記録')} / ${esc(e.role||'未記録')} / ${e.result==='win'?'勝利':e.result==='special'?'特殊継続':'敗北'}`;case'hEvent':return `${esc(e.name)} / ${esc(e.outcome||'')} / 勝舞魂 +${num(e.souls)}個`;default:return `${esc(e.name)} / ${esc(e.outcome||'')}`}}

function hokutoSubmit(k){let s=state.active,h=s.hokuto,e={kind:k,time:now()};if(k==='soul'){e.kind='soul';e.amount=valid('soulAmount');if(e.amount===null||e.amount<=0){toast('1個以上で入力してね');return}e.note=$('soulNote').value.trim();h.souls+=e.amount}if(k==='battle'){e.kind='battle';e.opponent=$('opponent').value;e.role=$('role').value;e.result=$('result').value;e.set=h.set;e.atIndex=s.events.filter(x=>x.kind==='atStart').length;if(e.result!=='special'){if(h.souls<1){toast('勝舞魂が足りないよ');return}h.souls--}h.battleLog.push({...e});if(e.result!=='lose')h.set++}if(k==='event'){e.kind='hEvent';e.name=$('hEventName').value;e.outcome=$('hOutcome').value;e.souls=valid('hEventSouls');if(e.souls===null)return;e.note=$('hNote').value.trim();h.souls+=e.souls}if(k==='atEnd'){e.kind='at';e.coins=valid('hAtCoins');if(e.coins===null)return;e.payout=optional('hPayout');e.chains=optional('hChains');if(e.payout===null||e.chains===null)return;e.atType='闘神演舞';h.atOpen=false;h.mode='normal';h.souls=0;h.set=1;h.battleLog=[]}if(k==='invest'){e.kind='invest';e.yen=valid('cashAmount');if(e.yen===null||e.yen<=0||e.yen%1000!==0){toast('1,000円単位で入力してね');return}e.amount=e.yen/1000*loanRate(s);s.cashYen+=e.yen;s.investment+=e.amount}if(k==='replay'){e.kind='replay';e.amount=pendingReplay;if(!e.amount){toast('＋46枚を押してね');return}s.replay+=e.amount}if(k==='break'){save();renderPlay();return}s.events.push(e);save();renderPlay();toast('記録したよ！')}
function rebuildHokuto(s){let h=s.hokuto,atOpen=false,set=1,souls=0,battleLog=[];for(const e of s.events){if(e.kind==='atStart'){atOpen=true;set=1;souls=0;battleLog=[]}if(e.kind==='soul')souls+=num(e.amount);if(e.kind==='hEvent')souls+=num(e.souls);if(e.kind==='battle'){if(e.result!=='special')souls--;battleLog.push({...e});if(e.result!=='lose')set++}if(e.kind==='at'){atOpen=false;set=1;souls=0;battleLog=[]}}h.atOpen=atOpen;h.mode=atOpen?'at':'normal';h.set=set;h.souls=Math.max(0,souls);h.battleLog=battleLog}function hokutoUndo(){let s=state.active;let i=s.events.length-1;if(i<0||s.events[i].kind==='atStart'){toast('この操作は戻せないよ');return}if(!confirm('直前の記録を取り消す？'))return;let e=s.events.pop();if(e.kind==='invest'){s.investment-=num(e.amount);s.cashYen-=num(e.yen)}if(e.kind==='replay')s.replay-=num(e.amount);rebuildHokuto(s);save();renderPlay()}
function renderHome(){let a=totalFor('ゆー'),b=totalFor('くー');$('total').textContent=fmt(a+b);$('yuTotal').textContent=fmt(a);$('bfTotal').textContent=fmt(b);$('machineTotals').innerHTML=[MONKEY,HOKUTO].map(m=>`<div class="entry"><b>${m===MONKEY?'🏍️':'👊'} ${machineName(m)}</b><div class="metric ${totalFor(null,m)>=0?'green':'red'}" style="font-size:22px">${fmt(totalFor(null,m))}</div><div class="small">${state.sessions.filter(s=>s.machine===m).length}台の実践</div></div>`).join('');drawChart()}function drawChart(){let list=[...state.sessions].sort((a,b)=>new Date(a.endTime)-new Date(b.endTime)),y=0,b=0,pts=[{y:0,b:0,t:0}];for(const s of list){if(s.person==='ゆー')y+=sessionDiff(s);else b+=sessionDiff(s);pts.push({y,b,t:y+b})}const values=pts.flatMap(p=>[p.y,p.b,p.t]);let lo=Math.min(0,...values),hi=Math.max(0,...values);if(hi===lo){hi+=100;lo-=100}const X=i=>36+(i/Math.max(1,pts.length-1))*288,Y=v=>180-(v-lo)/(hi-lo)*150;let svg=`<line x1="36" y1="30" x2="36" y2="180" stroke="#516078"/><line x1="36" y1="${Y(0)}" x2="325" y2="${Y(0)}" stroke="#6c788f" stroke-dasharray="4 4"/><text x="3" y="35">${hi}</text><text x="3" y="183">${lo}</text>`;for(const [k,c] of [['y','#5ee2b0'],['b','#6dafff'],['t','#f8d17c']])svg+=`<polyline fill="none" stroke="${c}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p,i)=>`${X(i)},${Y(p[k])}`).join(' ')}"/>`;svg+='<text x="36" y="202">開始</text><text x="285" y="202">最新</text>';$('chart').innerHTML=svg}
function renderHistory(){let h=$('historyBody');if(!state.sessions.length){h.innerHTML='<p class="small">まだ終了した実践はないよ。</p>';return}h.innerHTML=[...state.sessions].reverse().map(s=>`<div class="entry"><b>${stamp(s.startTime)} · ${esc(s.person)} <span class="${sessionDiff(s)>=0?'green':'red'}">${fmt(sessionDiff(s))}</span></b><div class="small">${esc(s.store||'店舗未入力')} / ${machineName(s)} / ${esc(s.machineNo||'–')}番台</div><div class="small">持込 ${num(s.carryIn)}枚（使用 ${num(s.carryUsed)}枚）＋ 追加 ${num(s.investment)}枚 ＋ 貯メダル ${num(s.replay)}枚 → 終了 ${num(s.recovery)}枚 · 初当たり ${s.events.filter(e=>e.kind==='hit').length}回 · AT ${s.events.filter(e=>e.kind==='at').length}件</div><details><summary>記録を表示</summary><p class="small">実稼働 ${durationLabel(s,s.endTime)} / 休憩 ${num(s.breakMinutes)}分 / 開始 ${num(s.startG)}G → 終了 ${num(s.endG)}G / ${s.tags.map(esc).join('・')}${s.machine===HOKUTO?' / 着席 '+num(s.startAbeshi)+'あべし'+shutterSummary(s):''}</p>${s.events.map(e=>`<div class="small">${stamp(e.time)} ${eventTitle(e)} ${eventText(e)}</div>`).join('')}</details><button class="danger" style="padding:7px 12px;margin-top:8px" onclick="deleteSession(${Number(s.id)})">この実践を削除</button></div>`).join('')}function deleteSession(id){if(!confirm('この実践を削除する？'))return;state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}
function renderStats(){let m=$('statsMachine').value,list=state.sessions.filter(s=>s.machine===m),hits=0,ats=[],byType={},mins=0,weightedYen=0,hasRate=true,games=0,diff=0,battles=[],special=0;for(const s of list){hits+=s.events.filter(e=>e.kind==='hit').length;mins+=minutes(s,s.endTime);diff+=sessionDiff(s);games+=num(s.totalG);let r=rate(s);if(r)weightedYen+=sessionDiff(s)*r;else hasRate=false;for(const e of s.events.filter(e=>e.kind==='at')){ats.push(e);(byType[e.atType||'AT']??=[]).push(e.payout)}battles.push(...s.events.filter(e=>e.kind==='battle'))}let avg=a=>a.length?(a.reduce((x,y)=>x+num(y),0)/a.length).toFixed(1):'–',hourly=mins>0&&hasRate?money(weightedYen/(mins/60))+'/h':'–',mach=games>0?(100*(1+diff/(3*games))).toFixed(2)+'%':'–';let html=`<div class="row" style="margin-top:18px"><div><div class="small">終了実践</div><b>${list.length}台</b></div><div><div class="small">初当たり</div><b>${hits}回</b></div></div><div class="line"></div><div class="row"><div><div class="small">合計差枚</div><b>${fmt(diff)}</b></div><div><div class="small">実稼働合計</div><b>${(mins/60).toFixed(1)}時間</b></div></div><div class="row" style="margin-top:16px"><div><div class="small">参考時給（交換換算）</div><b>${hourly}</b></div><div><div class="small">推定機械割</div><b>${mach}</b></div></div><p class="small">※時給は店舗の交換レートで換算。機械割は総ゲーム数×3枚投入と仮定した推定値だよ。</p><div class="line"></div><div class="small">ATリザルト記録数</div><div class="metric">${ats.length}件</div><div class="small">全ATリザルト平均：${avg(ats.map(e=>e.payout).filter(x=>x!==null&&x!==undefined))}枚</div><div class="line"></div><h2>🟢 AT区間の分析</h2>${list.map(s=>{let p=phaseInfo(s);return p.length?`<div class="entry"><b>${esc(s.person)} · ${stamp(s.startTime)}</b>${p.map((x,i)=>`<div class="small">${i+1}回目：通常時使用 ${x.normalUsed}枚 / AT純増 ${fmt(x.net)}（${x.start} → ${x.end}枚）</div>`).join('')}</div>`:''}).join('')}<p class="small">※AT中の現金投資・再プレイは純増から差し引き。旧記録は区間分析の対象外。</p>${Object.entries(byType).map(([k,v])=>`<div class="entry"><b>${esc(k)}</b><div class="small">${v.length}件 / リザルト平均 ${avg(v.filter(x=>x!=null))}枚</div></div>`).join('')}`;if(m===HOKUTO){let regular=battles.filter(e=>e.result!=='special'),wins=regular.filter(e=>e.result==='win'),specials=battles.filter(e=>e.result==='special');html+=`<div class="line"></div><h2>👊 神拳勝舞の分析</h2><div class="row"><div><div class="small">通常勝負</div><b>${regular.length}回</b></div><div><div class="small">勝舞魂1個あたり勝率</div><b>${regular.length?(100*wins.length/regular.length).toFixed(1)+'%':'–'}</b></div></div><p class="small">特殊継続 ${specials.length}回（通常勝負の勝率には含めない）</p><h3>対戦相手別</h3>${groupBattles(regular,'opponent')}<h3>成立役別</h3>${groupBattles(regular,'role')}<h3>狙い方別の収支</h3>${['リセット狙い','シャッター狙い','設定狙い','その他'].map(t=>{let ss=list.filter(s=>s.tags.includes(t));return `<div class="entry small">${t}：${ss.length}台 / ${fmt(ss.reduce((a,s)=>a+sessionDiff(s),0))}</div>`}).join('')}<p class="small">※狙い方を複数選んだ実践は、それぞれの集計に含まれるよ。</p>`} $('statsBody').innerHTML=html}function groupBattles(battles,key){let groups={};for(const b of battles){let name=b[key]||'未記録';(groups[name]??=[]).push(b)}return Object.entries(groups).map(([name,items])=>`<div class="entry small">${esc(name)}：${items.filter(e=>e.result==='win').length}勝 / ${items.length}回（${(100*items.filter(e=>e.result==='win').length/items.length).toFixed(1)}%）</div>`).join('')||'<p class="small">まだ記録がないよ。</p>'}
function renderSettings(){$('storeSettings').innerHTML=`<h2>🏬 店舗別レート設定</h2><p class="small">例：1000円で46枚貸出・50枚交換なら、46 / 50 を入力してね。</p>${input('newStore','店舗名','text','','例：○○店')}${input('lendRate','貸出枚数（1000円あたり）','number','46')}${input('exchangeRate','交換枚数（1000円あたり）','number','50')}<button class="primary" style="width:100%;margin-top:12px" onclick="addStore()">店舗を登録・更新</button>${state.stores.map(t=>`<div class="entry"><b>${esc(t.name)}</b><div class="small">貸出 ${t.lend}枚 / 交換 ${t.exchange}枚（1000円あたり）</div></div>`).join('')}`}function addStore(){let name=$('newStore').value.trim(),lend=num($('lendRate').value),exchange=num($('exchangeRate').value);if(!name||lend<=0||exchange<=0){toast('店舗名とレートを確認してね');return}state.stores=state.stores.filter(x=>x.name!==name);state.stores.push({name,lend,exchange});save();renderSettings();toast('店舗を登録したよ！')}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='slotlog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function clearData(){if(!confirm('すべての実践・店舗設定を削除する？ この操作は取り消せないよ'))return;if(!confirm('本当に削除していい？ バックアップを確認してね'))return;state={sessions:[],active:null,stores:[]};save();nav('home')}render();
</script></body></html>
